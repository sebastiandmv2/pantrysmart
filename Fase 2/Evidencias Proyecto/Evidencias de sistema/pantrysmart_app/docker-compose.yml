version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: pantrysmart_mysql
    env_file: .env
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pantrysmart_api
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./api:/app  # hot-reload en desarrollo

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: pantrysmart_mobile
    env_file: .env
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${MOBILE_HOST:-0.0.0.0}
      - API_URL=http://api:8000
    ports:
      - "${MOBILE_PORT:-8081}:8081"  # Metro bundler
      - "${EXPO_PORT:-19000}:19000"  # Expo dev server
      - "${EXPO_PORT_1:-19001}:19001"  # Expo dev server websocket
      - "${EXPO_PORT_2:-19002}:19002"  # Expo dev server
    volumes:
      - ./mobile:/app  # hot-reload en desarrollo
      - /app/node_modules  # evitar conflictos con node_modules del host
    command: ["npm", "run", "start-lan"]

  adminer:
    image: adminer:latest
    container_name: pantrysmart_adminer
    depends_on:
      - db
    ports:
      - "${ADMINER_PORT}:8080"

volumes:
  dbdata:
